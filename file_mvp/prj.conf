# prj.conf – FAT32 microSD on ESP32 Thing Plus C (Zephyr 4.x)

# ── Shell ─────────────────────────────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y

# ── Hardware drivers ──────────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_SPI=y

# ── SD card stack ─────────────────────────────────────────────────────────────
CONFIG_DISK_ACCESS=y
# pulls in the SPI SDHC driver automatically
CONFIG_SDHC=y

# ── FAT32 file system ─────────────────────────────────────────────────────────
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# auto-format if no FAT found (disable in production)
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_NUM_FILES=4
CONFIG_FS_FATFS_NUM_DIRS=4

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
# INF
CONFIG_LOG_DEFAULT_LEVEL=3

# ── Heap (for malloc in shell commands) ───────────────────────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=4096