# # ═══════════════════════════════════════════════════════════
# Sensor Node — prj.conf
# Sensors: BME280, ENS160, AS7343
# Sound: SPH0645 via I2S + FFT
# Transport: BLE peripheral → gateway
# ═══════════════════════════════════════════════════════════

# ── Bluetooth ────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HCI=y
CONFIG_BT_DEVICE_NAME="SensorNode"

# ACL buffer sizes — increased to support extended MTU for
# sound spectrum characteristic (3 × ~236 byte notifications)
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# L2CAP MTU — must be ≥ largest notification payload + 4 byte L2CAP header
# Largest sound packet = 238 bytes → set to 244 (BLE max for LE Data Packets)
CONFIG_BT_L2CAP_TX_MTU=247
# CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=11

# Allow MTU negotiation so gateway can request 244 byte ATT MTU
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_ATT_PREPARE_COUNT=0

# ── Hardware peripherals ─────────────────────────────────
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2S=y

# ── Sensors ──────────────────────────────────────────────
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_SENSOR_INIT_PRIORITY=95

# ── Floating point ────────────────────────────────────────
# Required for FFT (cosf, sinf, sqrtf) and sensor value formatting
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Console / logging ────────────────────────────────────
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_PRINTK_BUFFER_SIZE=4096

# Shell — useful for debug but disable in production to save RAM
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_CMDS=y

# ── Libraries ─────────────────────────────────────────────
CONFIG_JSON_LIBRARY=y

# ── Stack sizes ───────────────────────────────────────────
# Main stack — keep at 4096 for shell + sensor init
CONFIG_MAIN_STACK_SIZE=4096

# System workqueue — BLE stack uses this heavily
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Idle thread — minimum viable
CONFIG_IDLE_STACK_SIZE=512

# ISR stack — I2S DMA ISR is lightweight
CONFIG_ISR_STACK_SIZE=1536

# ── Heap ──────────────────────────────────────────────────
# BLE stack + I2S DMA descriptors + sensor drivers all draw from heap
CONFIG_HEAP_MEM_POOL_SIZE=29696

# ── ESP32-specific ────────────────────────────────────────
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

CONFIG_ADC=y
CONFIG_ADC_ESP32=y
CONFIG_MST_POLY=y

# #FUEL GAUGE 
CONFIG_FUEL_GAUGE=y

# CONFIG_SENSOR_NODE_1=y
# CONFIG_SENSOR_NODE_2=y
CONFIG_SENSOR_NODE_3=y

CONFIG_SD_LOGGING=y
CONFIG_SD_LOG_ALWAYS_WRITE=y

# # ── FAT32 file system ─────────────────────────────────────────────────────────
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# auto-format if no FAT found (disable in production)
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_NUM_FILES=4
CONFIG_FS_FATFS_NUM_DIRS=4

CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

CONFIG_PICOLIBC_IO_FLOAT=y

CONFIG_UART_ESP32=y

CONFIG_POWEROFF=y