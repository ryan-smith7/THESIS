# ============================================================
# Combined: BLE Central + Ethernet + Oracle MQTT Bridge
# Target: esp32_poe/esp32/procpu  (WROOM — no PSRAM)
#
# NOTE: MbedTLS removed — MQTT connects plaintext to Oracle Cloud VM
# which bridges to Azure IoT Hub over TLS server-side.
# Production path: ESP32-WROVER + restore TLS config below.
# ============================================================

# –– Core ––
CONFIG_INIT_STACKS=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# –– Logging ––
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=512
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL=n
CONFIG_SHELL_LOG_BACKEND=n

# –– JSON / UUID ––
CONFIG_JSON_LIBRARY=y
CONFIG_UUID=y
CONFIG_UUID_V4=y

# –– Peripherals ––
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y

# –– Bluetooth Central (GATT client) ––
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=n
CONFIG_BT_BONDABLE=n
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_L2CAP_TX_BUF_COUNT=3
CONFIG_BT_CONN_TX_MAX=3

# –– Networking Core ––
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_SETTINGS=n

# –– Ethernet ––
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETH_ESP32=y

# –– IP / DHCP / Sockets ––
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# –– DNS ––
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AI_MAX_ENTRIES=2

# –– MQTT (plaintext — no TLS) ––
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=n
CONFIG_MQTT_KEEPALIVE=60

# –– TLS / MbedTLS — DISABLED for plaintext bridge mode ––
# Removing MbedTLS frees ~40KB dram1 previously used for TLS heap,
# allowing BT host pools and MQTT to coexist on WROOM.
#
# To restore for production WROVER deployment:
#   CONFIG_MQTT_LIB_TLS=y
#   CONFIG_TLS_CREDENTIALS=y
#   CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
#   CONFIG_MBEDTLS=y
#   CONFIG_MBEDTLS_BUILTIN=y
#   CONFIG_MBEDTLS_ENABLE_HEAP=y
#   CONFIG_MBEDTLS_HEAP_SIZE=40960
#   CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y
#   CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096
#   CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
#   CONFIG_MBEDTLS_TLS_VERSION_1_2=y
#   CONFIG_MBEDTLS_SERVER_NAME_INDICATION=y
#   CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
#   CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
#   CONFIG_MBEDTLS_ECDH_C=y
#   CONFIG_MBEDTLS_ECP_C=y
#   CONFIG_MBEDTLS_PKCS1_V15=y
#   CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
#   CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
#   CONFIG_MBEDTLS_RSA_C=y

# –– Network Buffers ––
CONFIG_NET_TX_STACK_SIZE=1536
CONFIG_NET_RX_STACK_SIZE=1536
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=512



# –– SNTP ––
CONFIG_SNTP=y

# –– ESP32 memory ––
CONFIG_ESP32_REGION_1_NOINIT=y

CONFIG_MQTT_KEEPALIVE=10