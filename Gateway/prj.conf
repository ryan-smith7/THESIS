# ============================================================
# BLE Gateway Board (ESP32 #1) — BLE Central + UART TX
# ============================================================

# –– Core ––
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096   
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# –– Logging ––
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_BUFFER_SIZE=4096              
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n

# –– Libraries ––
CONFIG_JSON_LIBRARY=y
CONFIG_UUID=y
CONFIG_UUID_V4=y

# –– Peripherals ––
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_RTC=y

# –– UART (TX to WiFi board on UART2 GPIO17) ––
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# –– Bluetooth Central ––
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SMP=y

# ACL buffers — must fit largest sound notification (238 bytes payload)
# ATT header (3) + L2CAP header (4) + payload (238) = 245 → round to 251
CONFIG_BT_BUF_ACL_RX_SIZE=251          
CONFIG_BT_BUF_ACL_TX_SIZE=251          

# L2CAP TX MTU — must be ≥ 244 (BLE max for LE Data Packets)
CONFIG_BT_L2CAP_TX_MTU=244           

# TX buffer count — 2 subscriptions per connection × 4 connections
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_CONN_TX_MAX=16

# GATT — need enough attribute buffers for 2 characteristics × 4 connections
CONFIG_BT_GATT_READ_MULTIPLE=y

# –– Heap ––
# Reassembly buffers: 4 connections × sound_reassembly struct (~700 bytes each)
# + BLE stack internals
CONFIG_HEAP_MEM_POOL_SIZE=29696

# –– ESP32 ––
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y