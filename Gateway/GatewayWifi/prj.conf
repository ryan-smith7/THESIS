# ============================================================
# Combined: BLE Central + WiFi + Azure IoT Hub MQTT/TLS
# Target: esp32_devkitc_wrover/esp32/procpu
# ============================================================

# –– Core ––
CONFIG_INIT_STACKS=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# –– Logging ––
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_BUFFER_SIZE=256
# CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL=n
CONFIG_SHELL_LOG_BACKEND=n

# –– JSON ––
CONFIG_JSON_LIBRARY=y

# –– UUID ––
CONFIG_UUID=y
CONFIG_UUID_V4=y

# –– Peripherals ––
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
# CONFIG_RTC=y

# –– Bluetooth Central (GATT client) ––
# Uncomment this entire block when adding BT.
# BT host buffers are PSRAM-safe (no DMA); only the controller
# HCI buffers (managed by ESP-IDF, not these Kconfig symbols) need DRAM.
# The dual-heap in esp_wifi_adapter.c reserves 32KB DRAM for WiFi DMA,
# leaving the remaining DRAM headroom for BT controller HCI buffers.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=3
# CONFIG_BT_MAX_PAIRED=3
# CONFIG_BT_SMP=y
# ACL buffer sizes — must match or exceed sensor side (251)
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# L2CAP TX MTU — must be ≥ 238 bytes + 4 byte L2CAP header = 242, set to 244
CONFIG_BT_L2CAP_TX_MTU=247
# Increase TX buffer count to handle back-to-back notifications without drops
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
# CONFIG_BT_CONN_TX_MAX=20
CONFIG_BT_ATT_TX_COUNT=12

# # Replace the ignored CONFIG_BT_CONN_TX_MAX=20 with:
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_BUF_EVT_RX_COUNT=7

# Add — this is the actual fix for the -ENOBUFS scan failure during drain
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=7



# –– Networking Core ––
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# –– WiFi ––
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
# Dual-heap in esp_wifi_adapter.c routes WiFi management allocs to PSRAM
# and DMA/internal allocs to a dedicated 32KB DRAM heap. Both flags now
# work correctly — no longer breaks WiFi connection.
# CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# –– ESP32 WiFi internal buffer sizing ––
# RX BA window raised back to 16 — DRAM pressure relieved by dual-heap.
CONFIG_ESP32_WIFI_RX_BA_WIN=16

# –– IP (IPv4 only) ––
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y

# –– DHCP ––
CONFIG_NET_DHCPV4=y

# –– Sockets ––
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# –– DNS ––
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AI_MAX_ENTRIES=2

# –– MQTT ––
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=n
CONFIG_MQTT_KEEPALIVE=10


# –– TLS / MbedTLS ––

# –– Network Buffers ––
# 128-byte data size keeps net_buf allocations small enough to stay in DRAM.
CONFIG_NET_TX_STACK_SIZE=1536
CONFIG_NET_RX_STACK_SIZE=1536
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=512

# –– Heap ––
# 16KB DRAM anchor for early boot and general Zephyr allocations.
# The dual-heap in esp_wifi_adapter.c manages its own 32KB DRAM pool
# for WiFi DMA and 120KB PSRAM pool for WiFi management separately —
# those do not draw from this general heap.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# –– SNTP ––
# CONFIG_SNTP=y

# –– PSRAM ––
# Skip memtest to reduce boot time — saves ~1 second which previously
CONFIG_ESP_SPIRAM=y

CONFIG_NET_UDP=y

CONFIG_REBOOT=y