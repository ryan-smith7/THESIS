# ── Bluetooth ────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HCI=y
CONFIG_BT_DEVICE_NAME="SensorNodeCurrent"

# ACL buffer sizes — increased to support extended MTU for
# sound spectrum characteristic (3 × ~236 byte notifications)
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# L2CAP MTU — must be ≥ largest notification payload + 4 byte L2CAP header
# Largest sound packet = 244 bytes
CONFIG_BT_L2CAP_TX_MTU=247
# Allow MTU negotiation so gateway can request 244 byte ATT MTU
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_ATT_PREPARE_COUNT=0

# ── Floating point ────────────────────────────────────────
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Console / logging ────────────────────────────────────
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_PRINTK_BUFFER_SIZE=4096

# ── Stack sizes ───────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
# System workqueue — BLE stack uses this heavily
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ── Heap ──────────────────────────────────────────────────
# BLE stack draws from heap
CONFIG_HEAP_MEM_POOL_SIZE=29696
# you should comment this below one out
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y