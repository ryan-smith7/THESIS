# I2S subsystem
CONFIG_I2S=y

# Floating point unit — required for FFT performance
# Without this, all float ops run in slow software emulation
CONFIG_FPU=y

# Float support in printk / cbprintf
# Required for %.1f %.2f format specifiers to work correctly
CONFIG_CBPRINTF_FP_SUPPORT=y

# Console output
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Logging (keep at warning level to reduce noise during FFT output)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_PRINTK_BUFFER_SIZE=4096


# ESP32-specific: suppress unsupported revision warning
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# ── Memory tuning ───────────────────────────────────────────
# The FFT working buffers + DMA slabs use ~40 KB of DRAM.
# Reduce thread stacks to free headroom.

# Main thread stack — 2 KB is sufficient (no recursion, no large locals)
CONFIG_MAIN_STACK_SIZE=2048

# Idle thread — minimum viable
CONFIG_IDLE_STACK_SIZE=512

# ISR stack — I2S DMA ISR is lightweight
CONFIG_ISR_STACK_SIZE=2048

# System heap — used by Zephyr internals and slab metadata
CONFIG_HEAP_MEM_POOL_SIZE=8192
# TX refill thread uses K_THREAD_STACK_DEFINE (512 bytes, static BSS)
# No extra Kconfig needed.

